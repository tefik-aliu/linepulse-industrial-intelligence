[project]
name = "linepulse-industrial-intelligence"
version = "0.1.0"
description = "Explainable industrial quality, reliability and observability proof-of-work."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"tests/*" = ["S101"]
